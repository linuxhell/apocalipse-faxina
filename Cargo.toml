[package]
name = "apocalipse-faxina"
version = "0.2.0"
edition = "2021"
authors = ["linuxhell"]
description = "Apocalipse Faxina - manutenção e limpeza portátil para Windows x64"
build = "build.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.6", default-features = false, features = ["jpeg"] }
sha2 = "0.10.9"
same-file = "1.0.6"
glob = "0.3.3"
walkdir = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.12.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

name: Build Windows x64

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolver versão do pacote
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "Versão não encontrada em Cargo.toml" }
          $version = $line.Matches[0].Groups[1].Value
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Versão resolvida: $version"

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Preparar mídia embutida
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/linuxhell/apocalipse-download-manager/main/apps/desktop/src-tauri/assets/about-background.jpg" -OutFile assets\about-background.jpg
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/linuxhell/apocalipse-download-manager/main/apps/desktop/src-tauri/assets/about-creator.jpg" -OutFile assets\about-creator.jpg
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/linuxhell/apocalipse-download-manager/main/apps/desktop/src-tauri/assets/about-theme.mp4" -OutFile assets\about-theme.mp4
          if ((Get-Item assets\about-theme.mp4).Length -lt 100000) { throw "Falha ao obter a musica da secao Sobre" }
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            choco install ffmpeg -y --no-progress
            $ffmpeg = Get-Command ffmpeg.exe -ErrorAction Stop
          }
          & $ffmpeg.Source -y -i assets\about-theme.mp4 -vn -codec:a libmp3lame -b:a 128k assets\about-theme.mp3
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path assets\about-theme.mp3)) { throw "Falha ao preparar MP3 embutido da secao Sobre" }
          if ((Get-Item assets\about-theme.mp3).Length -lt 100000) { throw "MP3 embutido da secao Sobre invalido" }

      - name: Compilar release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Preparar portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\Apocalipse-Faxina | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\apocalipse-faxina.exe dist\Apocalipse-Faxina\Apocalipse-Faxina.exe
          New-Item -ItemType Directory -Force -Path dist\Apocalipse-Faxina\data | Out-Null
          New-Item -ItemType Directory -Force -Path dist\Apocalipse-Faxina\config | Out-Null
          New-Item -ItemType Directory -Force -Path dist\Apocalipse-Faxina\backups | Out-Null
          New-Item -ItemType Directory -Force -Path dist\Apocalipse-Faxina\logs | Out-Null
          New-Item -ItemType Directory -Force -Path dist\Apocalipse-Faxina\assets | Out-Null
          Copy-Item assets\about-background.jpg dist\Apocalipse-Faxina\assets\about-background.jpg
          Copy-Item assets\about-creator.jpg dist\Apocalipse-Faxina\assets\about-creator.jpg
          Copy-Item assets\about-theme.mp4 dist\Apocalipse-Faxina\assets\about-theme.mp4
          Copy-Item assets\about-theme.mp3 dist\Apocalipse-Faxina\assets\about-theme.mp3
          Set-Content -Encoding UTF8 dist\Apocalipse-Faxina\data\LEIA-ME.txt "Coloque winapp2.ini nesta pasta para carregar as regras Winapp2, ou selecione outro arquivo dentro do programa."

      - name: Artefato Windows x64 portátil
        uses: actions/upload-artifact@v4
        with:
          name: Apocalipse-Faxina-Windows-x64
          path: dist/Apocalipse-Faxina/
          if-no-files-found: error

      - name: Preparar ZIP do release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $zip = "Apocalipse-Faxina-Windows-x64-v$env:RELEASE_VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path dist\Apocalipse-Faxina -DestinationPath $zip -CompressionLevel Optimal

      - name: Publicar GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          Apocalipse Faxina v$env:RELEASE_VERSION para Windows x64 portátil.

          Correções desta versão:
          - Safe Scan do Registro agora mostra quantos itens foram removidos e quantos falharam.
          - Itens sem permissão ficam identificados e desmarcados após a tentativa, evitando loop.
          - Chaves ActiveX/COM protegidas deixam de ser classificadas como removíveis quando não há acesso de escrita.
          - Diálogos nativos de arquivo/pasta deixam de gerar falsos avisos de travamento da interface.

          Destaques:
          - Limpeza segura com análise antes da remoção.
          - Exclusões globais que prevalecem sobre as regras de limpeza.
          - Proteções padrão para caminhos críticos usados por impressão no Windows.
          - Resíduos profundos e localizador de arquivos duplicados.
          - Integração Winapp2.ini com perfil persistente e preset seguro.
          - Navegadores portáteis: Chrome, Edge e Firefox.
          - Thunderbird Portable.
          - Limpeza de Python / desenvolvimento.
          - WinSxS usando mecanismos oficiais do Windows.
          - Discos/SSD com múltiplos modos de otimização e relatórios antes/depois.
          - Gerenciamento de Driver Store.
          - Safe Scan do Registro com backup, resumo de removidos/falhas e proteção contra loop em chaves sem permissão.
          - Inicialização, tarefas agendadas, serviços e menu de contexto.
          - Reparo do Windows e da Internet com diagnóstico e backup de rede.
          - Sistema de diagnóstico/debug estruturado.
          - Seção Sobre com mídia e áudio embutido.
          - Faxina Uninstaller.
          - Link de doação PayPal.
          "@ | Set-Content -Encoding UTF8 release-notes.md

          $tag = "v$env:RELEASE_VERSION"
          $zip = "Apocalipse-Faxina-Windows-x64-$tag.zip"
          $title = "Apocalipse Faxina $tag"

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar a tag $tag." }

            gh release upload $tag $zip --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Falha ao substituir o ZIP do release $tag." }

            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar as notas do release $tag." }
          } else {
            gh release create $tag $zip --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title $title --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar o release $tag." }
          }